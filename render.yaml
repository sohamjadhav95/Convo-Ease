# One-click deploy on Render (free plan): Dashboard -> New -> Blueprint -> pick this repo.
# You will be asked for the values marked "sync: false".
services:
  - type: web
    name: convoease
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CONVOEASE_ENV
        value: production
      - key: CONVOEASE_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
